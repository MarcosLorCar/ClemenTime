name: Sync ESI Schedules

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [master]
    paths:
      - 'schedules/script/**'
      - 'schedules/input/**'
      - 'process_schedules.py'
      - '.github/workflows/sync-esi-schedules.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download and re-process from ESI TV endpoint'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-esi-schedules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Check ESI API Endpoint for Schedule Updates
        id: check
        env:
          SCHEDULE_SOURCE_URL: ${{ secrets.SCHEDULE_SOURCE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python3 -u schedules/script/check_esi_update.py $ARGS

      - name: Process Schedules
        id: process
        if: >
          steps.check.outputs.has_update == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push'
        run: |
          python3 -u process_schedules.py --strict

      - name: Commit and Push
        if: >
          success() && (
          steps.check.outputs.has_update == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' )
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add schedules/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync ESI schedules from TV hall API [skip ci]"
            git push
          fi
