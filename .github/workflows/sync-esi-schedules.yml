name: Sync ESI Schedules

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    # master only. This job runs the paid Gemini parse and auto-commits its output, so on
    # '**' every feature-branch push touching these paths burned quota and pushed a commit
    # back to that branch. Use workflow_dispatch to test from a branch.
    branches: [master]
    paths:
      - 'schedules/pdf/**'
      - 'schedules/script/**'
      - 'process_schedules.py'
      - '.github/workflows/sync-esi-schedules.yml'
  workflow_dispatch:

# Prevents concurrent runs from colliding during git commits/pushes.
# cancel-in-progress must stay false: this job commits and pushes, and cancelling it
# mid-push can leave downloaded PDFs and an updated esi_meta.json uncommitted while the
# metadata claims they were already seen.
concurrency:
  group: sync-esi-schedules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches downloaded wheels across runs

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pdf2image pillow pydantic python-dotenv

      - name: Cache Gemini AI Responses
        uses: actions/cache@v4
        with:
          path: schedules/script/.cache
          key: gemini-cache-${{ runner.os }}-${{ hashFiles('schedules/pdf/*.pdf') }}
          restore-keys: |
            gemini-cache-${{ runner.os }}-

      - name: Check ESI Web Page for Schedule Updates
        id: check
        env:
          SCHEDULE_SOURCE_URL: ${{ secrets.SCHEDULE_SOURCE_URL }}
        run: |
          OUTPUT=$(python3 -u schedules/script/check_esi_update.py)
          echo "$OUTPUT"
          if [[ "$OUTPUT" == *"[Update Detected]"* ]]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Process Schedules
        # Runs if:
        # 1. ESI web check detects an update, OR
        # 2. Triggered manually via GitHub UI, OR
        # 3. A git push touched the paths in this workflow's `on.push.paths` filter.
        #
        # (3) is just `event_name == 'push'`: the paths filter above already guarantees a
        # push only reaches this job when those files changed. The previous condition tried
        # to re-check with contains(github.event.head_commit.added, 'schedules/pdf/'), which
        # can never be true — those fields are arrays of full file paths and contains() does
        # exact element matching, not prefix matching.
        if: >
          steps.check.outputs.has_update == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_ALT: ${{ secrets.GEMINI_API_KEY_ALT }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          python3 -u process_schedules.py --strict

      - name: Commit and Push
        # success() is required: supplying any `if` replaces the implicit success() check,
        # so without it a failed "Process Schedules" step would still commit whatever
        # half-written state it left behind.
        if: >
          success() && (
          steps.check.outputs.has_update == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' )
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add schedules/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync ESI schedules from PDF via AI pipeline [skip ci]"
            git push
          fi
