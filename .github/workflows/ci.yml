name: CI Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Superseded PR builds are cancelled: pushing three times to a PR used to run three full
# test+assemble jobs to completion. cancel-in-progress is gated on the event so that master
# builds — the guard for direct pushes — always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Validate Schedule Pipeline
        run: |
          python3 process_schedules.py --strict

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug
