name: CI Build & Test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'

# Superseded PR builds are cancelled: pushing three times to a PR used to run three full
# test+assemble jobs to completion. cancel-in-progress is gated on the event so that master
# builds — the guard for direct pushes — always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Schedule Pipeline
        run: |
          python3 process_schedules.py --strict
          python3 -m unittest discover -s schedules/script -p "test_*.py"

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            python3 - <<'PY'
          import copy, json
          path = "app/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          has_debug = any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.marcoslorcar.clementime.debug"
              for c in clients
          )
          if not has_debug and clients:
              debug_client = copy.deepcopy(clients[0])
              debug_client.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = "com.marcoslorcar.clementime.debug"
              clients.append(debug_client)
              data["client"] = clients
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
          PY
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug
