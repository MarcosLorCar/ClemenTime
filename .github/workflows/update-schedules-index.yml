name: Update Schedules Index

# Safety net for hand-edited dist files. The schedule sync pipeline already regenerates the index
# itself (process_schedules.py step 4) and commits with [skip ci], so this only fires for
# schedule JSON committed by hand.
on:
  push:
    branches: [ master ]
    paths:
      - 'schedules/dist/**'
      - '!schedules/dist/schedules_index.json'
      - '!schedules/dist/schedules_catalog.json'

concurrency:
  group: schedules-master-write
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate Index
        run: python3 schedules/script/generate_index.py

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add schedules/dist/schedules_index.json schedules/dist/schedules_catalog.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update schedules index [skip ci]"
            git pull --rebase origin master
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify FCM Topic Subscribers
        if: success() && steps.commit.outputs.committed == 'true'
        env:
          FCM_SERVICE_ACCOUNT_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_KEY }}
        run: |
          python3 -u schedules/script/notify_fcm.py
