name: Update Schedules

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Fetch raw schedule
        run: |
          # Note: Set the SCHEDULE_SOURCE_URL secret in your repository settings
          if [ -n "${{ secrets.SCHEDULE_SOURCE_URL }}" ]; then
            mkdir -p schedules/input
            curl -L "${{ secrets.SCHEDULE_SOURCE_URL }}" -o schedules/input/raw_schedule.json
          else
            echo "SCHEDULE_SOURCE_URL secret not set. Skipping fetch."
          fi
          
      - name: Process schedules
        run: python process_schedules.py --strict --name "ESI2026-27-GRADO_{sem}_Grupos"
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add schedules/dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated schedule update: $(date +'%Y-%m-%d')"
            git push
          fi
